tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Title
              validate:
                - required
          -
            handle: entry
            field:
              type: entries
              display: Entry
              create: false
              max_items: 1
          -
            handle: url
            field:
              type: text
              display: URL
              if:
                link_type: 'equals url'
              visibility: hidden
          -
            handle: mega_menu
            field:
              type: toggle
              display: 'Mega menu'
              instructions: 'Toont het volledige aanbod per categorie onder dit item. Alleen zinvol op het item dat naar de aanbod-pagina wijst.'
