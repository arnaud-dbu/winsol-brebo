title: Offerte
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: products
            field:
              type: range_checkboxes
              display: 'Voor welke producten?'
              validate:
                - required
          -
            handle: location
            field:
              type: location_select
              display: 'Naar welk filiaal?'
              placeholder: 'Kies een filiaal…'
          -
            handle: name
            field:
              type: text
              display: Naam
              placeholder: 'Voor- en achternaam'
              width: 50
              validate:
                - required
          -
            handle: phone
            field:
              type: text
              input_type: tel
              display: Telefoon
              placeholder: '+32 …'
              width: 50
          -
            handle: email
            field:
              type: text
              input_type: email
              display: E-mail
              placeholder: 'naam@voorbeeld.be'
              width: 50
              validate:
                - required
                - email
          -
            handle: postal_code
            field:
              type: text
              display: Postcode
              placeholder: 'bv. 1700'
              width: 50
          -
            handle: project
            field:
              type: textarea
              display: 'Vertel kort over uw project'
              placeholder: 'Wat wilt u laten plaatsen? Afmetingen, wensen, timing…'
          -
            handle: attachment
            field:
              type: assets
              container: private
              folder: offertes
              max_files: 1
              display: 'Foto of plan toevoegen (optioneel)'
