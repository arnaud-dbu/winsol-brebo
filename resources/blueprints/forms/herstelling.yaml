title: Herstelling
tabs:
  main:
    display: Main
    sections:
      -
        display: Probleem
        fields:
          -
            handle: product
            field:
              type: range_select
              display: 'Over welk product gaat het?'
              placeholder: 'Kies een productgroep…'
              width: 50
              validate:
                - required
          -
            handle: is_winsol
            field:
              type: select
              display: 'Is het een Winsol-product?'
              placeholder: 'Kies…'
              options:
                ja: Ja
                nee: Nee
              width: 50
              validate:
                - required
          -
            handle: installed
            field:
              type: text
              display: 'Wanneer werd het ongeveer geplaatst?'
              placeholder: 'bv. 2021'
              width: 50
              validate:
                - required
          -
            handle: facade
            field:
              type: select
              display: 'Aan welke gevel?'
              placeholder: 'Kies…'
              options:
                voorgevel: Voorgevel
                achtergevel: Achtergevel
                zijgevel: Zijgevel
              width: 50
              validate:
                - required
          -
            handle: floor
            field:
              type: text
              display: 'Op welke verdieping?'
              placeholder: 'bv. gelijkvloers, 1e verdieping'
              width: 50
              validate:
                - required
          -
            handle: dimensions
            field:
              type: text
              display: 'Afmetingen van het product'
              instructions: 'Bij benadering volstaat. Zo weten we welk materiaal en hoeveel mensen er nodig zijn.'
              placeholder: 'bv. 240 x 180 cm'
              validate:
                - required
          -
            handle: problem
            field:
              type: textarea
              display: 'Wat is er aan de hand?'
              placeholder: 'Beschrijf het probleem zo concreet mogelijk.'
              validate:
                - required
          -
            handle: branch
            field:
              type: select
              display: 'Naar welk filiaal?'
              placeholder: 'Kies een filiaal…'
              validate:
                - required
          -
            handle: photo
            field:
              type: assets
              container: private
              folder: herstellingen
              max_files: 1
              display: 'Foto van het probleem (optioneel)'
              validate:
                - 'mimes:jpg,jpeg,png,webp,heic,heif,hif,pdf'
                - 'max_filesize:10240'
          -
            handle: invoice
            field:
              type: assets
              container: private
              folder: herstellingen
              max_files: 1
              display: 'Originele factuur (indien bij de hand)'
              validate:
                - 'mimes:jpg,jpeg,png,webp,heic,heif,hif,pdf'
                - 'max_filesize:10240'
      -
        display: Contact
        fields:
          -
            handle: email
            field:
              type: text
              input_type: email
              display: E-mail
              placeholder: 'naam@voorbeeld.be'
              validate:
                - required
                - email
          -
            handle: name
            field:
              type: text
              display: Naam
              placeholder: 'Voor- en achternaam'
              width: 50
              validate:
                - required
          -
            handle: phone
            field:
              type: text
              display: Telefoon
              placeholder: '+32 …'
              width: 50
              validate:
                - required
          -
            handle: address
            field:
              type: text
              display: Adres
              placeholder: 'Straat en nummer, gemeente'
              validate:
                - required
