title: SEO
fields:
  - handle: meta_title
    field:
      type: text
      display: "Meta Title"
      instructions: "Fallback title for pages that have no title of their own, such as the 404 page. A page's own title always wins, so this is a safety net rather than a site-wide title."
      character_limit: 60
      input_type: text
      antlers: false
      localizable: true

  - handle: meta_description
    field:
      type: textarea
      display: "Meta Description"
      instructions: "Fallback summary for pages that have neither their own meta description nor an intro. Aim for 150–160 characters."
      character_limit: 160
      localizable: true

  - handle: meta_image
    field:
      type: assets
      container: assets
      display: "Sharing Image"
      instructions: "Default image for pages shared on Facebook, LinkedIn, X, etc. Recommended: 1200×630 px. Pages with their own sharing image keep theirs."
      max_files: 1
      restrict: false
      allow_uploads: true
      localizable: true

  - handle: seo_noindex
    field:
      type: toggle
      display: "Hide the whole site from search engines"
      instructions: "Turn this on to keep Google out of every page at once, for as long as the site is under construction. Switch it off before going live."
      default: false
      localizable: true
