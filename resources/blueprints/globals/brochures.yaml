title: Brochures
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: items
            field:
              type: grid
              display: Brochures
              instructions: 'De lijst waaruit bezoekers op de brochurepagina kunnen kiezen. Het label is wat zij zien; de pdf wordt gemaild.'
              mode: table
              add_row: 'Brochure toevoegen'
              fields:
                -
                  handle: label
                  field:
                    type: text
                    display: Label
                    validate:
                      - required
                -
                  handle: file
                  field:
                    type: assets
                    container: assets
                    folder: brochures
                    restrict: true
                    max_files: 1
                    display: Pdf
                    validate:
                      - required
                      - 'mimes:pdf'
