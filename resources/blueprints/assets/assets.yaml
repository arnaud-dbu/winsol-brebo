title: Asset
fields:
  -
    handle: alt
    field:
      display: 'Alt Text'
      type: text
      instructions: 'Description of the image'
  -
    handle: source_filename
    field:
      display: 'Oorspronkelijke bestandsnaam'
      type: text
      instructions: 'Naam zoals het bestand in de bronmap stond, voor de sanering bij import. winsol:clean-watermarks --list toont deze naam, zodat een aanvraag bij Winsol terug te koppelen is.'
  -
    handle: watermark
    field:
      display: Watermerk
      type: toggle
      instructions: 'Automatisch gezet bij import. Wordt door winsol:clean-watermarks weer uitgezet zodra het logo weggesneden is.'
  -
    handle: watermark_box
    field:
      display: 'Watermerkvlak'
      type: text
      instructions: 'x,y,breedte,hoogte in pixels. Automatisch gezet bij import.'
