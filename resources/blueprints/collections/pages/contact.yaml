title: Contact
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            import: page_intro
      -
        fields:
          -
            handle: quicklinks
            field:
              type: grid
              display: Quicklinks
              mode: stacked
              add_row: '+ Add quicklink'
              fields:
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                    required: true
                    validate:
                      - required
                -
                  handle: text
                  field:
                    type: textarea
                    display: Text
                -
                  import: image
                -
                  import: link
                -
                  handle: link_style
                  field:
                    type: select
                    display: 'Link Style'
                    default: primary
                    options:
                      primary: Primary
                      outline: Outline
      -
        fields:
          -
            import: page_builder
  preview:
    display: Preview
    sections:
      -
        fields:
          -
            import: preview
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            import: template
