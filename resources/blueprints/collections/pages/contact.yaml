title: Contact
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            import: page_intro
      -
        fields:
          -
            handle: quicklinks
            field:
              type: entries
              collections:
                - quicklinks
              display: Quicklinks
      -
        fields:
          -
            import: page_builder
  preview:
    display: Preview
    sections:
      -
        fields:
          -
            import: preview
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            import: template
