hide: true
title: Home
tabs:
  main:
    display: Main
    sections:
      -
        display: Hero
        fields:
          -
            handle: title
            field:
              type: text
              display: Title
              required: true
              validate:
                - required
          -
            handle: text
            field:
              type: textarea
              display: Text
          -
            import: link
          -
            import: image
      -
        display: 'Value Proposition'
        fields:
          -
            handle: value_proposition
            field:
              type: group
              display: 'Value Proposition'
              fields:
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                -
                  handle: items
                  field:
                    type: replicator
                    display: 'Value Propositions'
                    collapse: accordion
                    button_label: 'Add Value Proposition'
                    sets:
                      new_set_group:
                        display: 'New Set Group'
                        sets:
                          value_proposition:
                            display: 'Value Proposition'
                            fields:
                              -
                                import: icon
                              -
                                handle: title
                                field:
                                  type: text
                                  display: Title
                              -
                                handle: text
                                field:
                                  type: textarea
                                  display: Text
      -
        fields:
          -
            import: page_builder
  preview:
    display: Preview
    sections:
      -
        fields:
          -
            import: preview
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            import: template
