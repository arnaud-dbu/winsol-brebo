title: Range
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Title
              required: true
              validate:
                - required
          -
            handle: short_description
            field:
              type: textarea
              display: 'Short Description'
          -
            handle: long_description
            field:
              type: textarea
              display: 'Long Description'
          -
            import: image
          -
            handle: range_categories
            field:
              type: terms
              taxonomies:
                - range_categories
              display: 'Range Category'
          -
            handle: order
            field:
              type: integer
              display: Volgorde
              instructions: 'Bepaalt de volgorde binnen de categorie op de aanbod-pagina. Laag getal komt eerst.'
              required: true
              validate:
                - required
          -
            handle: brochure
            field:
              type: assets
              display: Brochure
              container: assets
              folder: brochures
              restrict: true
              max_files: 1
              localizable: true
              instructions: 'Optioneel. Staat er een brochure, dan wordt de brochure-quicklink een directe download; anders verdwijnt die kaart.'
              validate:
                - 'mimes:pdf'
      -
        fields:
          -
            import: page_builder
  preview:
    display: Preview
    sections:
      -
        fields:
          -
            import: preview
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            import: template
