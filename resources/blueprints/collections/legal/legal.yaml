title: Legal
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            import: page_header
            config:
              title:
                required: true
      -
        fields:
          -
            import: redactor
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
  preview:
    display: Preview
    sections:
      -
        fields:
          -
            import: preview
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
