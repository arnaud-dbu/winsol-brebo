title: Article
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            import: page_header_image
      -
        fields:
          -
            import: article_redactor
  preview:
    display: Preview
    sections:
      -
        fields:
          -
            import: preview
  promo:
    display: Actie
    sections:
      -
        fields:
          -
            import: promo
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            import: visibility
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
          -
            handle: author_name
            field:
              type: text
              display: Auteur
              instructions: 'Naam van wie het artikel schreef. Staat onder de titel en in de structured data. Leeg laten zet er Winsol Brebo.'
          -
            handle: themes
            field:
              type: terms
              taxonomies:
                - themes
              max_items: 1
              create: false
              display: Categorie
              required: true
              validate:
                - required
