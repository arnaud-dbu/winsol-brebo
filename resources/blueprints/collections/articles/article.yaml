title: Article
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            import: page_header_image
            config:
              title:
                required: true
      -
        fields:
          -
            import: redactor
  preview:
    display: Preview
    sections:
      -
        fields:
          -
            import: preview
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
