title: Product
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Title
              required: true
              validate:
                - required
          -
            handle: range
            field:
              type: entries
              display: Range
              collections:
                - ranges
              max_items: 1
              localizable: true
              instructions: 'Bepaalt de URL van dit product: /aanbod/<range>/<product>.'
              required: true
              validate:
                - required
          -
            handle: product_groups
            field:
              type: terms
              taxonomies:
                - product_groups
              max_items: 1
              mode: select
              display: Productgroep
              instructions: 'Groepeert dit product in de sprongbalk bovenaan de aanbodpagina. Leeg laten mag: het product valt dan onder "Overige".'
          -
            handle: text
            field:
              type: textarea
              display: Text
          -
            import: image
          -
            handle: brochure
            field:
              type: assets
              display: Brochure
              container: assets
              folder: brochures
              restrict: true
              max_files: 1
              localizable: true
              instructions: 'Optioneel. Staat er een brochure, dan wordt de brochure-quicklink een directe download; anders verdwijnt die kaart.'
              validate:
                - 'mimes:pdf'
      -
        fields:
          -
            import: page_builder
  preview:
    display: Preview
    sections:
      -
        fields:
          -
            import: preview
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            import: template
