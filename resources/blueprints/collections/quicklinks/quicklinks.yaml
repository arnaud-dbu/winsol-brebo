title: Quicklink
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              display: Title
              validate:
                - required
          -
            handle: text
            field:
              type: textarea
              display: Text
          -
            import: image
          -
            import: link
          -
            handle: link_style
            field:
              type: select
              display: 'Link Style'
              default: primary
              options:
                primary: Primary
                outline: Outline
          -
            handle: type
            field:
              type: select
              display: Type
              default: default
              localizable: true
              instructions: 'Kies "Brochure" om deze kaart de brochure van de pagina te laten downloaden. Zonder brochure verdwijnt de kaart.'
              options:
                default: Standaard
                brochure: Brochure
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
  preview:
    display: Preview
    sections:
      -
        fields:
          -
            import: preview
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
