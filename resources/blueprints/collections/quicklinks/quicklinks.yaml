title: Quicklink
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              display: Title
              validate:
                - required
          -
            handle: text
            field:
              type: textarea
              display: Text
          -
            import: image
          -
            import: link
          -
            handle: link_style
            field:
              type: select
              display: 'Link Style'
              default: primary
              options:
                primary: Primary
                outline: Outline
          -
            handle: type
            field:
              type: select
              display: Type
              default: default
              localizable: true
              instructions: 'Kies "Brochure" om deze kaart naar het brochureformulier te laten linken, met de brochure van de pagina aangevinkt. Kies "Offerte" om op een productpagina het product mee te geven aan het offerteformulier.'
              options:
                default: Standaard
                brochure: Brochure
                offerte: Offerte
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
  preview:
    display: Preview
    sections:
      -
        fields:
          -
            import: preview
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
