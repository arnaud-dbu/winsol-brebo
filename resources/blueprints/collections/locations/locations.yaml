title: Location
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: hidden
              required: false
          -
            handle: name
            field:
              type: text
              display: Name
              required: true
              validate:
                - required
          -
            handle: street
            field:
              type: text
              display: Street
          -
            handle: number
            field:
              type: text
              display: Number
          -
            handle: postal_code
            field:
              type: text
              display: 'Postal Code'
          -
            handle: city
            field:
              type: text
              display: City
          -
            handle: latitude
            field:
              type: float
              display: Latitude
              instructions: 'Uit Google Maps, bv. 50.8631'
          -
            handle: longitude
            field:
              type: float
              display: Longitude
              instructions: 'Uit Google Maps, bv. 4.2564'
          -
            handle: opening_hours
            field:
              type: grid
              mode: table
              display: 'Opening Hours'
              add_row: 'Add Row'
              fields:
                -
                  handle: day
                  field:
                    type: text
                    display: Day
                -
                  handle: time
                  field:
                    type: text
                    display: Time
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
  preview:
    display: Preview
    sections:
      -
        fields:
          -
            import: preview
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
