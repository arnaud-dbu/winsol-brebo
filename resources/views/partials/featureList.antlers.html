{{ if items }}
    <ul class="feature-list flex flex-col gap-1 mt-3 lg:mt-5">
        {{ items }}
            <li class="flex items-center gap-2 lg:gap-3">
                {{ svg src="icons/regular/check" class="size-4 shrink-0 lg:size-5 " }}
                <span>{{ label }}</span>
            </li>
        {{ /items }}
    </ul>
{{ /if }}
