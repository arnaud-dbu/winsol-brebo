{{ if version == "2" }}
    <button type="button" class="hamburger hamburger--v2 {{ class }}" data-hamburger
        {{ if controls }}aria-controls="{{ controls }}"{{ /if }}
        {{ if data_target }}data-target="{{ data_target }}"{{ /if }}
        aria-label="{{ if aria_label }}{{ aria_label }}{{ else }}Toggle navigation{{ /if }}" aria-expanded="false">
        <span class="hamburger__line"></span>
        <span class="hamburger__line"></span>
        <span class="hamburger__line"></span>
        <span class="hamburger__line"></span>
        <span class="hamburger__line"></span>
        <span class="hamburger__line"></span>
    </button>

    </button>

{{ else }}

        <span class="hamburger__line"></span>

{{ /if }}
