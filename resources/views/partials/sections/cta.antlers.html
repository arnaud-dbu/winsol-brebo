<section class="cta relative isolate overflow-hidden pt-80 pb-10 lg:pt-100 lg:pb-24" data-section="cta">
    {{ if image }}
        {{ img :src="image" fill="true" sizes="100vw" class="size-full object-cover" }}
    {{ /if }}
    <div class="relative container flex flex-col items-start justify-end lg:justify-center">
        <div class="w-full max-w-md rounded-md bg-black/25 card-padding text-white backdrop-blur-sm lg:hidden">
            {{ partial:sectionHeader btn_variant="btn btn--primary" }}
        </div>

        <div class="hidden w-full rounded-md bg-accent card-padding lg:block lg:w-auto lg:max-w-2xl">
            {{ partial:sectionHeader btn_variant="btn btn--secondary" accent_bg="true" }}
        </div>
    </div>
</section>
