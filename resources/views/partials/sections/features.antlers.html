<section class="section section--default" data-section="features">
    <div class="container">
        <div class="section-y-gap">
            {{ partial:sectionHeader centered_from="lg" }}

            {{ if features }}
                <div class="grid grid-cols-1 grid-gutter lg:grid-cols-4">
                    {{ features }}
                        <div class="feature-item flex gap-5 lg:flex-col lg:items-center lg:text-center">
                            {{ if icon }}
                                {{ icon:index src="{{ icon | raw }}" class="size-12 shrink-0 text-accent" }}
                            {{ /if }}

                            <div class="flex flex-col gap-3">
                                {{ if title }}
                                    <h3>{{ title }}</h3>
                                {{ /if }}

                                {{ if text }}
                                    <p>{{ text }}</p>
                                {{ /if }}
                            </div>
                        </div>
                    {{ /features }}
                </div>
            {{ /if }}
        </div>
    </div>
</section>
