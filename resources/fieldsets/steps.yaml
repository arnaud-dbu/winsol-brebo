title: Steps
fields:
    - import: section_header
    - handle: step
      field:
          collapse: accordion
          type: replicator
          display: Step
          sets:
              new_set_group:
                  display: 'New Set Group'
                  sets:
                      step:
                          display: Step
                          fields:
                              - handle: title
                                field:
                                    type: text
                                    display: Title
                              - handle: text
                                field:
                                    type: textarea
                                    display: Text
