title: SEO
fields:
  - handle: meta_title
    field:
      type: text
      display: "Meta Title"
      instructions: "The title shown in Google search results. Aim for 50–60 characters. If left empty, the page title will be used."
      character_limit: 60
      input_type: text
      antlers: false
      localizable: true

  - handle: meta_description
    field:
      type: textarea
      display: "Meta Description"
      instructions: "A short summary shown below the title in Google. Aim for 150–160 characters. Make it compelling — this is your sales pitch in search results."
      character_limit: 160
      localizable: true

  - handle: meta_image
    field:
      type: assets
      display: "Sharing Image"
      instructions: "The image shown when this page is shared on Facebook, LinkedIn, X, etc. Recommended: 1200×630 px. If left empty, a site-wide default will be used."
      container: assets
      max_files: 1
      restrict: false
      allow_uploads: true
      localizable: true

  - handle: seo_noindex
    field:
      type: toggle
      display: "Hide from search engines"
      instructions: "Turn this on to prevent Google from showing this page in search results. Useful for thank-you pages, internal pages, or pages under construction."
      default: false
      localizable: true
