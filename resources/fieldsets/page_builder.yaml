title: 'Page Builder'
fields:
  -
    handle: page_builder
    field:
      type: replicator
      display: 'Page Builder'
      collapse: accordion
      button_label: 'Add Section'
      sets:
        new_set_group:
          display: 'New Set Group'
          sets:
            cta:
              display: 'Call to Action'
              fields:
                -
                  handle: overline
                  field:
                    type: text
                    display: Overline
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                -
                  handle: text
                  field:
                    type: textarea
                    display: Text
                -
                  import: link
                -
                  import: image
            cards:
              display: Cards
              fields:
                -
                  handle: overline
                  field:
                    type: text
                    display: Overline
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                -
                  handle: text
                  field:
                    type: textarea
                    display: Text
                -
                  handle: cards
                  field:
                    type: replicator
                    display: Cards
                    collapse: accordion
                    button_label: 'Add Card'
                    sets:
                      new_set_group:
                        display: 'New Set Group'
                        sets:
                          card:
                            display: Card
                            fields:
                              -
                                import: image
                              -
                                handle: title
                                field:
                                  type: text
                                  display: Title
                              -
                                handle: text
                                field:
                                  type: bard
                                  display: Text
                                  buttons:
                                    - bold
                                    - italic
                                    - anchor
                                  container: assets
                                  remove_empty_nodes: false
                              -
                                handle: features
                                field:
                                  type: replicator
                                  display: Features
                                  collapse: accordion
                                  button_label: 'Add Feature'
                                  sets:
                                    new_set_group:
                                      display: 'New Set Group'
                                      sets:
                                        feature:
                                          display: Feature
                                          fields:
                                            -
                                              handle: label
                                              field:
                                                type: text
                                                display: Label
            image_gallery:
              display: 'Image Gallery'
              fields:
                -
                  handle: overline
                  field:
                    type: text
                    display: Overline
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                -
                  handle: images
                  field:
                    type: assets
                    container: assets
                    display: Images
            technical_details:
              display: 'Technical Details'
              fields:
                -
                  handle: overline
                  field:
                    type: text
                    display: Overline
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                -
                  handle: text
                  field:
                    type: textarea
                    display: Text
                -
                  import: link
                -
                  handle: technical_details
                  field:
                    type: grid
                    mode: table
                    display: 'Technical Details'
                    add_row: 'Add Row'
                    fields:
                      -
                        handle: key
                        field:
                          type: text
                          display: Key
                      -
                        handle: value
                        field:
                          type: text
                          display: Value
            ranges:
              display: Ranges
              fields:
                -
                  handle: overline
                  field:
                    type: text
                    display: Overline
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                -
                  handle: range
                  field:
                    type: entries
                    collections:
                      - ranges
                    display: Ranges
            text:
              display: Text
              fields:
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                -
                  handle: text
                  field:
                    buttons:
                      - bold
                      - italic
                      - anchor
                    container: assets
                    remove_empty_nodes: false
                    type: bard
                    display: Text
                -
                  import: link
            text_image:
              display: 'Text + Image'
              fields:
                -
                  import: section_header
                -
                  handle: background
                  field:
                    type: toggle
                    display: Background
                -
                  handle: media
                  field:
                    type: button_group
                    display: Media
                    default: image
                    localizable: true
                    options:
                      none: Geen
                      image: Afbeelding
                      video: Video
                -
                  handle: image
                  field:
                    type: assets
                    display: Image
                    container: assets
                    max_files: 1
                    localizable: true
                    if:
                      media: 'equals image'
                -
                  handle: video
                  field:
                    type: video
                    display: Video
                    localizable: true
                    if:
                      media: 'equals video'
                -
                  handle: features
                  field:
                    type: replicator
                    display: Features
                    collapse: accordion
                    button_label: 'Add Feature'
                    sets:
                      new_set_group:
                        display: 'New Set Group'
                        sets:
                          feature:
                            display: Feature
                            fields:
                              -
                                handle: label
                                field:
                                  type: text
                                  display: Label
            embed:
              display: Embed
              fields:
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                    localizable: true
                -
                  handle: url
                  field:
                    type: text
                    display: URL
                    localizable: true
                    instructions: 'Volledige https-URL van de externe widget.'
                    required: true
                    validate:
                      - required
                      - 'url'
                -
                  handle: height
                  field:
                    type: integer
                    display: Hoogte
                    default: 900
                    localizable: true
                    instructions: 'Hoogte van het venster in pixels.'
            products:
              display: Products
              fields:
                -
                  handle: overline
                  field:
                    type: text
                    display: Overline
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                -
                  handle: products
                  field:
                    type: entries
                    collections:
                      - products
                    display: Products
            projects:
              display: Projects
              fields:
                -
                  handle: overline
                  field:
                    type: text
                    display: Overline
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                -
                  import: link
                -
                  handle: projects
                  field:
                    type: entries
                    collections:
                      - projects
                    display: Projects
            features:
              display: Features
              fields:
                -
                  handle: overline
                  field:
                    type: text
                    display: Overline
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                -
                  handle: features
                  field:
                    type: replicator
                    display: Features
                    collapse: accordion
                    button_label: 'Add Feature'
                    sets:
                      new_set_group:
                        display: 'New Set Group'
                        sets:
                          feature:
                            display: Feature
                            fields:
                              -
                                import: icon
                              -
                                handle: title
                                field:
                                  type: text
                                  display: Title
                              -
                                handle: text
                                field:
                                  type: textarea
                                  display: Text
            grid_cta:
              display: 'Grid CTA'
              fields:
                -
                  import: image
                -
                  handle: grid
                  field:
                    type: replicator
                    display: Grid
                    collapse: accordion
                    button_label: 'Add Item'
                    sets:
                      new_set_group:
                        display: 'New Set Group'
                        sets:
                          item:
                            display: Item
                            fields:
                              -
                                handle: title
                                field:
                                  type: text
                                  display: Title
                              -
                                handle: text
                                field:
                                  type: textarea
                                  display: Text
                              -
                                import: link
