title: Brochure
email:
  -
    id: brochure-delivery
    to: '{{ email }}'
    subject: 'Je Winsol-brochures liggen klaar'
    html: emails/brochure
    text: emails/brochure_text
  -
    id: brochure-notification
    to: offertes@winsolspl.be
    reply_to: '{{ email }}'
    subject: 'Nieuwe brochureaanvraag van {{ name }}'
    html: emails/notification
    text: emails/notification_text
    label: Brochureaanvraag
