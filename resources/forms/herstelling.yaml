title: Herstelling
email:
  -
    id: herstelling-notification
    to: offertes@winsolspl.be
    reply_to: '{{ email }}'
    subject: 'Nieuwe herstelaanvraag van {{ name }}'
    html: emails/notification
    text: emails/notification_text
    label: Herstelaanvraag
    attachments: true
  -
    id: herstelling-confirmation
    to: '{{ email }}'
    reply_to: offertes@winsolspl.be
    subject: site.mail_confirmation_subject
    html: emails/confirmation
    text: emails/confirmation_text
