# Voor de koppelende partij op staging: genoeg om te zien waar hun via de API
# aangemaakte content landt, en niets meer. Bewust geen `super`, want dat geeft
# ook het recht om content en gebruikers te verwijderen.
inspace:
  title: Inspace
  permissions:
    - 'access cp'
    - 'view articles entries'
    - 'edit articles entries'
    - 'view themes terms'
    - 'view assets assets'
    - 'upload assets assets'
